# Stack completo NovaBank: servicios de Yuly (frontend, coreografía, pasarela) +
# servicios de Sofía (cuentas, riesgo, saga orquestada con Prefect). Ver
# docs/CONTRATO_EVENTOS.md para el contrato de eventos/API compartido.
#
# accounts y risk exponen HTTP directo (para la orquestación) Y escuchan
# saga.eventos en Redis (para la coreografía) — ver redis_listener.py en cada uno.

services:
  redis:
    image: redis:7-alpine
    container_name: novabank-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pasarela-interbancaria:
    build: ./services/pasarela-interbancaria
    container_name: novabank-pasarela-interbancaria
    environment:
      REDIS_URL: redis://redis:6379/0
      PASARELA_DB_PATH: /data/pasarela.db
      PASARELA_DELAY_MIN: "2"
      PASARELA_DELAY_MAX: "4"
    volumes:
      - pasarela_data:/data
    ports:
      - "8300:8300"
    depends_on:
      redis:
        condition: service_healthy

  gateway-coreografia:
    build: ./services/gateway-coreografia
    container_name: novabank-gateway-coreografia
    environment:
      REDIS_URL: redis://redis:6379/0
      GATEWAY_DB_PATH: /data/gateway_coreografia.db
    volumes:
      - gateway_coreografia_data:/data
    ports:
      - "8100:8100"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: novabank-frontend
    environment:
      VITE_GATEWAY_COREOGRAFIA_URL: http://localhost:8100
      VITE_GATEWAY_ORQUESTADA_URL: http://localhost:8200
    ports:
      - "5173:5173"
    depends_on:
      - gateway-coreografia

  # --- Servicios de Sofía ---------------------------------------------------

  accounts:
    build: ./services/accounts
    container_name: novabank-accounts
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

  risk:
    build: ./services/risk
    container_name: novabank-risk
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy

  clearing-stub:
    build: ./services/clearing-stub
    container_name: novabank-clearing-stub
    ports:
      - "8003:8003"

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: novabank-prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"

  saga-orchestrator:
    build: ./saga-orchestrator
    container_name: novabank-saga-orchestrator
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      ACCOUNTS_URL: http://accounts:8001
      RISK_URL: http://risk:8002
      CLEARING_URL: http://clearing-stub:8003
    ports:
      - "8200:8200"
    depends_on:
      - accounts
      - risk
      - clearing-stub
      - prefect-server
    # api.py expone POST /transferencia y GET /transferencia/{id}/estado
    # (mismo contrato que gateway-coreografia). flows.py también se puede
    # seguir disparando manualmente dentro del contenedor:
    #   docker compose exec saga-orchestrator python flows.py CTA-001 CTA-002 100 demo-1

volumes:
  pasarela_data:
  gateway_coreografia_data:
